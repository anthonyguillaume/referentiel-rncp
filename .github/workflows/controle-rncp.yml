name: Contrôle RNCP

on:
  #schedule:
    # Tous les jours à 04:30 UTC (06:30 à Paris l'été, 05:30 l'hiver).
    #- cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Envoyer le mail même sans changement"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: controle-rncp
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Génère output/Liens_CPF_controle.xlsx, summary.md/html, state/snapshot.json
      # et pose les sorties : changes (true/false), sujet, resume.
      - name: Contrôler les fiches RNCP
        id: controle
        run: python check_rncp.py

      - name: Publier le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-rncp-${{ github.run_number }}
          path: output/
          retention-days: 90

      # Configuration : tout en VARIABLES de dépôt (MAIL_SERVER, MAIL_PORT,
      # MAIL_USERNAME, MAIL_TO, MAIL_FROM), seul MAIL_PASSWORD est un SECRET.
      # MAIL_TO accepte plusieurs adresses séparées par des virgules.
      - name: Envoyer l'e-mail
        if: (steps.controle.outputs.changes == 'true' || inputs.force_email == true) && vars.MAIL_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER }}
          server_port: ${{ vars.MAIL_PORT }}
          # Décommenter si le serveur exige TLS implicite (port 465) :
          # secure: true
          username: ${{ vars.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Contrôle RNCP] ${{ steps.controle.outputs.sujet }}"
          to: ${{ vars.MAIL_TO }}
          from: "Contrôle RNCP <${{ vars.MAIL_FROM || vars.MAIL_USERNAME }}>"
          html_body: "file://output/summary.html"
          attachments: output/Liens_CPF_controle.xlsx

      # L'état n'est enregistré QU'APRÈS l'envoi réussi : si le mail échoue,
      # le job s'arrête en erreur et les mêmes changements seront re-signalés
      # à la prochaine exécution (aucune alerte perdue).
      # Le classeur annoté REMPLACE le fichier de base : data/ contient donc
      # toujours la dernière version, l'équipe n'a rien à redéposer.
      - name: Mettre à jour le fichier de base et l'état dans le dépôt
        if: steps.controle.outputs.changes == 'true'
        run: |
          cp output/Liens_CPF_controle.xlsx "${{ steps.controle.outputs.fichier }}"
          git config user.name "controle-rncp[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || git commit -m "Contrôle RNCP $(date -u +%F) — ${{ steps.controle.outputs.resume }}"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
