name: Contrôle RNCP

on:
  schedule:
    # Tous les jours à 04:30 UTC (06:30 à Paris l'été, 05:30 l'hiver).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controle-rncp
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Génère docs/ : diplomes_rncp.xlsx, index.html + data.json (site),
      # runs.json + runs.html (journal des générations), summary.md/html,
      # et met à jour state/snapshot.json.
      # Sorties : changes (true/false), sujet, resume.
      - name: Générer le référentiel des diplômes
        id: controle
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -o pipefail
          python genere_rncp.py 2>&1 | tee generation.log

      # En cas d'échec, l'erreur est inscrite dans le journal des générations
      # (state + docs/runs.json) pour apparaître sur la page runs.html.
      - name: Journaliser l'échec
        if: failure()
        run: python outils/journaliser_erreur.py generation.log

      - name: Publier le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-rncp-${{ github.run_number }}
          path: docs/
          retention-days: 90

      # L'état et le site sont committés à chaque run (le journal des
      # générations change même sans évolution des diplômes, et un échec y
      # est inscrit). GitHub Pages sert le dossier docs/.
      - name: Publier le site et l'état dans le dépôt
        if: always()
        run: |
          git config user.name "controle-rncp[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          resume="${{ steps.controle.outputs.resume }}"
          [ -n "$resume" ] || resume="échec de la génération"
          git diff --cached --quiet || git commit -m "Génération RNCP $(date -u +%F) — $resume"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
